[project]
name = "banking-hybrid-rag-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary,pool]",
    "pgvector",
    "openai",
    "cohere",
    "neo4j",
    "httpx",
    "PyJWT[crypto]",
    "langfuse",
    "python-multipart"
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy", "deepeval", "pip-audit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
