name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest

  merge-gate:
    needs: api
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          API_RESULT: ${{ needs.api.result }}
        run: test "$API_RESULT" = success
